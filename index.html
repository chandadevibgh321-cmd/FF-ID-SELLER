<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMART STUDY - छात्र पोर्टल</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary-bg: #0F172A;
            --secondary-bg: #1E293B;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --accent-color: #FACC15;
            --accent-gradient: linear-gradient(135deg, #FACC15, #FBBF24);
            --primary-button: #3B82F6;
            --border-color: #334155;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            padding-top: 65px;
            padding-bottom: 70px;
            min-height: 100vh;
        }
        body.light {
            --primary-bg: #F5F7FA;
            --secondary-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #666666;
            --border-color: #E2E8F0;
        }
        /* Header */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: var(--secondary-bg);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
        }
        .header-title {
            font-weight: 600;
            font-size: 1rem;
        }
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px;
        }
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--secondary-bg);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            border-top: 1px solid var(--border-color);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px 16px;
            border-radius: 30px;
        }
        .nav-item i {
            font-size: 1.5rem;
        }
        .nav-item span {
            font-size: 0.7rem;
            font-weight: 500;
        }
        .nav-item.active {
            color: var(--accent-color);
            background: rgba(250, 204, 21, 0.1);
        }
        /* Sections */
        .main-content {
            padding: 16px;
        }
        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Cards */
        .custom-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Test Card */
        .test-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .test-card:active {
            transform: scale(0.98);
        }
        .test-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .test-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            margin: 8px 0;
        }
        .badge-available {
            background: var(--success);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }
        /* Login Card */
        .login-card {
            max-width: 400px;
            margin: 40px auto;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .login-card input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            background: var(--primary-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .smart-logo i {
            font-size: 48px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .toggle-link {
            color: var(--accent-color);
            cursor: pointer;
            margin-top: 16px;
            display: inline-block;
        }
        /* Profile */
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin-bottom: 12px;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 16px 0;
        }
        .stat-item {
            text-align: center;
            flex: 1;
        }
        .stat-item strong {
            font-size: 1.3rem;
            display: block;
        }
        /* Leaderboard */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .rank-1 { background: linear-gradient(135deg, #FFD70020, transparent); border-left: 3px solid #FFD700; padding-left: 12px; border-radius: 8px; }
        .rank-2 { background: linear-gradient(135deg, #C0C0C020, transparent); border-left: 3px solid #C0C0C0; padding-left: 12px; border-radius: 8px; }
        .rank-3 { background: linear-gradient(135deg, #CD7F3220, transparent); border-left: 3px solid #CD7F32; padding-left: 12px; border-radius: 8px; }
        /* Quiz */
        .timer {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 16px;
        }
        .progress-bar {
            background: var(--border-color);
            border-radius: 50px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--success), #34D399);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .question-box {
            background: var(--primary-bg);
            border-radius: 20px;
            padding: 20px;
            margin: 16px 0;
        }
        .question-text {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .option {
            padding: 12px 16px;
            margin: 8px 0;
            background: var(--card-bg);
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .option.selected {
            background: var(--accent-gradient);
            color: #1a1a2e;
            border-color: transparent;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .nav-buttons button {
            padding: 10px 24px;
            background: var(--primary-button);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--success), #34D399);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
        }
        /* Share Buttons */
        .share-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .share-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 50px;
            font-size: 0.85rem;
        }
        /* No Data */
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        @media (max-width: 480px) {
            .main-content { padding: 12px; }
            .custom-card { padding: 14px; }
            .test-name { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <img src="" alt="Logo" class="header-logo" id="appLogo">
            <span class="header-title" id="headerUserGreeting">SMART STUDY</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="bi bi-moon-stars-fill"></i></button>
    </header>

    <main class="main-content">
        <!-- Login -->
        <div id="loginSection" class="section active">
            <div class="login-card">
                <div class="smart-logo"><i class="fas fa-graduation-cap"></i></div>
                <h3 id="authTitle">🔐 लॉगिन</h3>
                <input type="text" id="username" placeholder="यूजरनेम">
                <input type="email" id="email" placeholder="ईमेल">
                <input type="password" id="password" placeholder="पासवर्ड">
                <input type="text" id="fullName" placeholder="पूरा नाम" style="display:none;">
                <button id="authBtn" onclick="login()">लॉगिन करें</button>
                <div class="toggle-link" onclick="toggleAuthMode()">नया अकाउंट बनाएँ? साइनअप करें</div>
                <div id="authError" class="text-danger mt-2" style="font-size:0.8rem;"></div>
            </div>
        </div>

        <!-- Home -->
        <div id="homeSection" class="section">
            <div class="swiper-container" id="promotionSlider"><div class="swiper-wrapper"></div><div class="swiper-pagination"></div></div>
            <div id="announcementsBox"></div>
            <div id="liveClassBox" class="custom-card" style="border-left:4px solid var(--primary-button);"></div>
            <div class="section-title"><i class="bi bi-journal-bookmark-fill"></i> उपलब्ध टेस्ट</div>
            <div id="testsList"></div>
            <div class="section-title mt-3"><i class="bi bi-file-pdf-fill"></i> स्टडी नोट्स</div>
            <div id="notesList"></div>
        </div>

        <!-- Leaderboard -->
        <div id="leaderboardSection" class="section">
            <div class="section-title"><i class="bi bi-trophy-fill"></i> लीडरबोर्ड - टॉप 10</div>
            <div class="custom-card" id="leaderboardList"></div>
        </div>

        <!-- Profile -->
        <div id="profileSection" class="section">
            <div class="custom-card text-center">
                <img id="profileAvatar" src="" class="profile-avatar">
                <h3 id="profileName"></h3>
                <p id="profileEmail" style="font-size:0.8rem; color:var(--text-secondary);"></p>
                <div class="profile-stats">
                    <div class="stat-item"><strong id="totalTests">0</strong><span>टेस्ट</span></div>
                    <div class="stat-item"><strong id="avgScore">0</strong><span>औसत%</span></div>
                    <div class="stat-item"><strong id="bestScore">0</strong><span>बेस्ट%</span></div>
                </div>
                <div id="improvementTracker" class="mt-2"></div>
                <div id="badgesEarned" class="mt-2"></div>
                <div id="aiTip" class="mt-2" style="background:var(--primary-bg); padding:10px; border-radius:12px; font-size:0.8rem;"></div>
                <div class="share-buttons">
                    <button class="btn" style="background:#25D366; color:white;" onclick="shareResultAsImage()"><i class="bi bi-whatsapp"></i> WhatsApp</button>
                    <button class="btn" style="background:var(--primary-button); color:white;" onclick="downloadResultPDF()"><i class="bi bi-file-pdf"></i> PDF</button>
                </div>
                <hr style="margin:16px 0; border-color:var(--border-color);">
                <button class="btn" style="background:var(--danger); color:white;" onclick="logout()"><i class="bi bi-box-arrow-right"></i> लॉगआउट</button>
            </div>
            <div class="section-title"><i class="bi bi-clock-history"></i> टेस्ट हिस्ट्री</div>
            <div id="testHistoryList"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" data-section="homeSection"><i class="bi bi-house-door-fill"></i><span>Home</span></div>
        <div class="nav-item" data-section="leaderboardSection"><i class="bi bi-trophy-fill"></i><span>Leaderboard</span></div>
        <div class="nav-item" data-section="profileSection"><i class="bi bi-person-fill"></i><span>Profile</span></div>
    </nav>

    <!-- Quiz Modal -->
    <div id="examPage" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary-bg); z-index:2000; overflow-y:auto; padding:16px;">
        <div class="custom-card">
            <button class="btn" style="background:var(--text-secondary); color:white; padding:8px 16px; margin-bottom:12px;" onclick="closeExam()"><i class="bi bi-arrow-left"></i> वापस</button>
            <h2 id="testName" style="font-size:1.3rem;"></h2>
            <div class="timer" id="timer">⏱️ 90:00</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div id="questionContainer"></div>
            <div class="nav-buttons">
                <button onclick="prevQuestion()"><i class="bi bi-chevron-left"></i> पिछला</button>
                <span id="qCounter" style="padding:8px;">प्रश्न 1 / 0</span>
                <button onclick="nextQuestion()">अगला <i class="bi bi-chevron-right"></i></button>
            </div>
            <button class="submit-btn" onclick="submitExam()"><i class="bi bi-check-circle"></i> टेस्ट सबमिट करें</button>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewPage" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary-bg); z-index:2000; overflow-y:auto; padding:16px;">
        <div class="custom-card">
            <h2>📝 टेस्ट रिजल्ट - <span id="reviewTestName"></span></h2>
            <div class="text-center my-3">
                <h3>आपका स्कोर: <span id="reviewScore" style="color:var(--success);"></span> / <span id="reviewTotal"></span></h3>
                <h4 id="reviewPercentage"></h4>
                <div id="reviewBadge"></div>
            </div>
            <div id="reviewQuestionsList" style="max-height:400px; overflow-y:auto;"></div>
            <button class="btn" style="background:var(--primary-button); color:white; width:100%; margin-top:16px;" onclick="closeReview()"><i class="bi bi-house-door"></i> होम पर जाएँ</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDBxkEXfCDbvOCPKPIjCbSS3V2M6QOIKUY",
            authDomain: "zone-battel.firebaseapp.com",
            databaseURL: "https://zone-battel-default-rtdb.firebaseio.com",
            projectId: "zone-battel",
            storageBucket: "zone-battel.firebasestorage.app",
            messagingSenderId: "534047646078",
            appId: "1:534047646078:web:31d5ace3a74109fc76d32f"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null, currentTestId = null, questions = [], userAnswers = [], timerInterval = null, timeLeft = 0, currentQ = 0, isSignup = false;
        let swiperInstance = null, allResults = [];

        function toggleTheme() { document.body.classList.toggle('light'); localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark'); }
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light');

        async function loadAppSettings() {
            const snap = await db.ref('settings').once('value');
            const settings = snap.val() || {};
            if(settings.logoUrl) document.getElementById('appLogo').src = settings.logoUrl;
            else document.getElementById('appLogo').src = 'https://via.placeholder.com/40/FFFFFF/0F172A?text=S';
            document.title = settings.appName || 'SMART STUDY';
        }

        async function login() {
            const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value;
            if(!email || !password) { showError('सब भरें'); return; }
            try { await auth.signInWithEmailAndPassword(email, password); } catch(e) { showError(e.message); }
        }
        async function signup() {
            const username = document.getElementById('username').value.trim(), email = document.getElementById('email').value.trim(), password = document.getElementById('password').value, fullName = document.getElementById('fullName').value.trim();
            if(!username || !email || !password || !fullName) { showError('सब भरें'); return; }
            if(password.length < 6) { showError('पासवर्ड 6+ अक्षर'); return; }
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.ref('users/' + cred.user.uid).set({ username, email, fullName, totalTests: 0, avgScore: 0, bestScore: 0, badges: [], createdAt: Date.now() });
                alert('अकाउंट बन गया! अब लॉगिन करें'); toggleAuthMode();
            } catch(e) { showError(e.message); }
        }
        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('authTitle').innerText = isSignup ? '📝 साइनअप' : '🔐 लॉगिन';
            document.getElementById('fullName').style.display = isSignup ? 'block' : 'none';
            document.getElementById('authBtn').innerText = isSignup ? 'साइनअप करें' : 'लॉगिन करें';
            document.getElementById('authBtn').setAttribute('onclick', isSignup ? 'signup()' : 'login()');
            document.querySelector('.toggle-link').innerHTML = isSignup ? 'पहले से अकाउंट है? लॉगिन करें' : 'नया अकाउंट बनाएँ? साइनअप करें';
        }
        function showError(msg) { let e = document.getElementById('authError'); e.innerText = msg; setTimeout(() => e.innerText = '', 3000); }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`.nav-item[data-section="${sectionId}"]`).classList.add('active');
            if(sectionId === 'homeSection') { loadPromotions(); loadAnnouncements(); loadLiveClass(); loadAvailableTests(); loadNotes(); }
            if(sectionId === 'leaderboardSection') loadLeaderboard();
            if(sectionId === 'profileSection') loadProfile();
        }
        document.querySelectorAll('.nav-item').forEach(item => { item.addEventListener('click', () => showSection(item.dataset.section)); });

        async function loadDashboard() {
            const user = auth.currentUser;
            if(!user) return;
            const userSnap = await db.ref('users/' + user.uid).once('value');
            const userData = userSnap.val() || {};
            document.getElementById('headerUserGreeting').innerText = `नमस्ते, ${userData.fullName || user.email.split('@')[0]}`;
        }

        async function loadPromotions() {
            const snap = await db.ref('promotions').once('value');
            const activePromos = Object.values(snap.val() || {}).filter(p => p.imageUrl);
            const swiperWrapper = document.querySelector('#promotionSlider .swiper-wrapper');
            swiperWrapper.innerHTML = '';
            if(activePromos.length > 0) {
                activePromos.forEach(promo => {
                    const slide = document.createElement('div'); slide.className = 'swiper-slide';
                    slide.innerHTML = promo.link ? `<a href="${promo.link}" target="_blank"><img src="${promo.imageUrl}" alt="Promo" style="width:100%; height:100%; object-fit:cover;"></a>` : `<img src="${promo.imageUrl}" alt="Promo" style="width:100%; height:100%; object-fit:cover;">`;
                    swiperWrapper.appendChild(slide);
                });
                if(swiperInstance) swiperInstance.destroy(true, true);
                swiperInstance = new Swiper('#promotionSlider', { loop: true, autoplay: { delay: 3500 }, pagination: { el: '.swiper-pagination', clickable: true }, slidesPerView: 1 });
            } else swiperWrapper.innerHTML = '<div class="swiper-slide"><div class="no-data">कोई प्रोमोशन नहीं</div></div>';
        }

        async function loadAnnouncements() {
            const snap = await db.ref('announcements').once('value');
            let html = '';
            snap.forEach(a => { const d = a.val(); html += `<div class="custom-card" style="border-left:4px solid var(--warning);"><strong><i class="bi bi-megaphone-fill"></i> ${d.title}</strong><br>${d.text}<br><small style="color:var(--text-secondary);">${new Date(d.date).toLocaleString()}</small></div>`; });
            document.getElementById('announcementsBox').innerHTML = html || '<div class="custom-card">कोई नोटिस नहीं</div>';
        }

        async function loadLiveClass() {
            const snap = await db.ref('liveClass').once('value');
            const data = snap.val();
            if(data && data.link) {
                document.getElementById('liveClassBox').innerHTML = `<strong><i class="bi bi-camera-video-fill"></i> लाइव क्लास</strong><br>${data.title || 'क्लास शुरू होने वाली है'}<br><a href="${data.link}" target="_blank" class="btn" style="background:var(--primary-button); color:white; padding:8px 16px; border-radius:50px; display:inline-block; margin-top:8px;">क्लास जॉइन करें <i class="bi bi-box-arrow-up-right"></i></a>`;
            } else document.getElementById('liveClassBox').innerHTML = '<strong><i class="bi bi-camera-video-fill"></i> लाइव क्लास</strong><br>कोई लाइव क्लास शेड्यूल नहीं';
        }

        async function loadNotes() {
            const snap = await db.ref('notes').once('value');
            let html = '';
            snap.forEach(n => { const note = n.val(); html += `<div class="custom-card"><strong><i class="bi bi-link-45deg text-danger"></i> ${note.title}</strong><br><small>${note.description || ''}</small><br><a href="${note.fileUrl}" target="_blank" class="btn" style="background:var(--primary-button); color:white; padding:6px 12px; border-radius:50px; display:inline-block; margin-top:8px; font-size:0.8rem;"><i class="bi bi-eye"></i> खोलें / डाउनलोड करें</a></div>`; });
            document.getElementById('notesList').innerHTML = html || '<div class="custom-card">कोई नोट्स उपलब्ध नहीं</div>';
        }

        async function loadAvailableTests() {
            const testsSnap = await db.ref('tests').once('value');
            const user = auth.currentUser;
            const completedSnap = await db.ref(`users/${user.uid}/completedTests`).once('value');
            const completed = completedSnap.val() || {};
            let html = '';
            testsSnap.forEach(test => {
                const t = test.val();
                if(t.isPublic !== false && !completed[t.id]) {
                    html += `<div class="test-card" onclick="startTest('${test.key}', '${t.name}', ${t.timeMinutes || 90})">
                        <div class="test-name">📋 ${t.name}</div>
                        <div class="test-meta"><span><i class="bi bi-question-circle"></i> ${t.questions ? Object.keys(t.questions).length : 0} प्रश्न</span><span><i class="bi bi-clock"></i> ${t.timeMinutes || 90} मिनट</span></div>
                        <span class="badge-available"><i class="bi bi-check-circle"></i> उपलब्ध</span>
                    </div>`;
                }
            });
            document.getElementById('testsList').innerHTML = html || '<div class="custom-card">कोई टेस्ट उपलब्ध नहीं</div>';
        }

        async function loadLeaderboard() {
            const usersSnap = await db.ref('users').once('value');
            let users = [];
            usersSnap.forEach(u => { const data = u.val(); if(data.avgScore !== undefined && data.avgScore > 0) users.push({ name: data.fullName || data.username, avgScore: data.avgScore }); });
            users.sort((a,b) => b.avgScore - a.avgScore);
            let html = '';
            if(users.length === 0) {
                html = '<div class="no-data">🏆 कोई रैंकिंग उपलब्ध नहीं</div>';
            } else {
                users.slice(0,10).forEach((u, idx) => {
                    let rankClass = '';
                    if(idx === 0) rankClass = 'rank-1';
                    else if(idx === 1) rankClass = 'rank-2';
                    else if(idx === 2) rankClass = 'rank-3';
                    html += `<div class="leaderboard-item ${rankClass}">
                        <span><strong>${idx+1}.</strong> ${u.name}</span>
                        <span>⭐ ${u.avgScore.toFixed(1)}%</span>
                    </div>`;
                });
            }
            document.getElementById('leaderboardList').innerHTML = html;
        }

        async function loadProfile() {
            const user = auth.currentUser;
            if(!user) return;
            const userSnap = await db.ref('users/' + user.uid).once('value');
            const userData = userSnap.val() || {};
            document.getElementById('profileName').innerText = userData.fullName || userData.username;
            document.getElementById('profileEmail').innerText = user.email;
            document.getElementById('totalTests').innerText = userData.totalTests || 0;
            document.getElementById('avgScore').innerText = (userData.avgScore || 0).toFixed(1);
            document.getElementById('bestScore').innerText = (userData.bestScore || 0).toFixed(1);
            
            if(userData.photoURL) document.getElementById('profileAvatar').src = userData.photoURL;
            else document.getElementById('profileAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.fullName || userData.username)}&background=FACC15&color=1a1a2e&size=80`;
            
            const resultsSnap = await db.ref('results').orderByChild('userId').equalTo(user.uid).once('value');
            let scores = [];
            resultsSnap.forEach(r => { scores.push(r.val().percent); });
            scores.sort((a,b) => a - b);
            let improvementHtml = '';
            if(scores.length >= 2) {
                let lastScore = scores[scores.length-1];
                let firstScore = scores[0];
                let improvement = lastScore - firstScore;
                if(improvement > 0) improvementHtml = `<div style="color:var(--success);"><i class="bi bi-arrow-up-circle-fill"></i> शानदार! स्कोर ${improvement.toFixed(1)}% सुधरा!</div>`;
                else if(improvement < 0) improvementHtml = `<div style="color:var(--danger);"><i class="bi bi-arrow-down-circle-fill"></i> पिछले टेस्ट से ${Math.abs(improvement).toFixed(1)}% कम</div>`;
                else improvementHtml = `<div><i class="bi bi-dash-circle"></i> स्कोर स्थिर है</div>`;
            } else improvementHtml = `<div><i class="bi bi-info-circle"></i> और टेस्ट देंगे तो प्रोग्रेस दिखेगी!</div>`;
            document.getElementById('improvementTracker').innerHTML = improvementHtml;
            
            let badges = userData.badges || [];
            let badgeHtml = '';
            if(badges.includes('gold')) badgeHtml += '<span class="badge" style="background:#FFD700; color:#1a1a2e; padding:4px 10px; border-radius:20px; margin:2px;">🏅 गोल्ड</span>';
            if(badges.includes('silver')) badgeHtml += '<span class="badge" style="background:#C0C0C0; color:#1a1a2e; padding:4px 10px; border-radius:20px; margin:2px;">🥈 सिल्वर</span>';
            if(badges.includes('bronze')) badgeHtml += '<span class="badge" style="background:#CD7F32; color:white; padding:4px 10px; border-radius:20px; margin:2px;">🥉 ब्रॉन्ज</span>';
            if(badges.includes('iron')) badgeHtml += '<span class="badge" style="background:#4B5563; color:white; padding:4px 10px; border-radius:20px; margin:2px;">🔥 आयरन</span>';
            document.getElementById('badgesEarned').innerHTML = badgeHtml || 'कोई बैज नहीं';
            
            let avg = userData.avgScore || 0;
            let tip = avg < 50 ? '📚 कमजोर विषयों पर ध्यान दो!' : (avg < 70 ? '💪 अच्छा! और प्रैक्टिस करो' : '🎉 शानदार! टॉपर बनोगे!');
            document.getElementById('aiTip').innerHTML = `<i class="bi bi-robot"></i> AI टिप: ${tip}`;
            
            await loadTestHistory();
        }

        async function loadTestHistory() {
            const user = auth.currentUser;
            const resultsSnap = await db.ref('results').orderByChild('userId').equalTo(user.uid).once('value');
            allResults = [];
            let html = '';
            resultsSnap.forEach(r => { allResults.push(r.val()); });
            allResults.reverse();
            allResults.forEach(r => {
                html += `<div class="custom-card"><strong>${r.testName}</strong><br>स्कोर: ${r.score}/${r.total} (${r.percent.toFixed(1)}%)<br><small style="color:var(--text-secondary);">${new Date(r.submittedAt).toLocaleString()}</small></div>`;
            });
            document.getElementById('testHistoryList').innerHTML = html || '<div class="custom-card">कोई टेस्ट नहीं दिया</div>';
        }

        async function shareResultAsImage() {
            if(allResults.length === 0) { alert('कोई रिजल्ट नहीं'); return; }
            let latest = allResults[0];
            let html = `<div style="padding:20px; text-align:center; background:white; color:black; font-family:sans-serif;">
                <h2>SMART STUDY</h2>
                <h3>🎯 टेस्ट रिजल्ट</h3>
                <p><strong>नाम:</strong> ${document.getElementById('profileName').innerText}</p>
                <p><strong>टेस्ट:</strong> ${latest.testName}</p>
                <p><strong>स्कोर:</strong> ${latest.score}/${latest.total} (${latest.percent.toFixed(1)}%)</p>
                <p>📅 ${new Date(latest.submittedAt).toLocaleString()}</p>
                <hr><p>SMART STUDY - आपकी सफलता हमारा लक्ष्य</p>
            </div>`;
            let div = document.createElement('div'); div.innerHTML = html; div.style.position = 'absolute'; div.style.left = '-9999px'; document.body.appendChild(div);
            let canvas = await html2canvas(div);
            let imgData = canvas.toDataURL('image/png');
            if(navigator.share) { await navigator.share({ title: 'SMART STUDY Result', files: [new File([await (await fetch(imgData)).blob()], 'result.png', { type: 'image/png' })] }); }
            else { window.open(imgData, '_blank'); alert('लॉन्ग प्रेस करके सेव करें'); }
            document.body.removeChild(div);
        }

        async function downloadResultPDF() {
            if(allResults.length === 0) { alert('कोई रिजल्ट नहीं'); return; }
            let latest = allResults[0];
            let element = document.createElement('div'); element.innerHTML = `<div style="padding:20px; background:white; color:black;"><h2>SMART STUDY</h2><h3>टेस्ट रिजल्ट</h3><p>नाम: ${document.getElementById('profileName').innerText}</p><p>टेस्ट: ${latest.testName}</p><p>स्कोर: ${latest.score}/${latest.total} (${latest.percent.toFixed(1)}%)</p><p>तारीख: ${new Date(latest.submittedAt).toLocaleString()}</p><hr><p>SMART STUDY - शिक्षा का स्मार्ट तरीका</p></div>`;
            element.style.position = 'absolute'; element.style.left = '-9999px'; document.body.appendChild(element);
            html2pdf().from(element).set({ margin: 1, filename: 'result.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }).save();
            document.body.removeChild(element);
        }

        async function startTest(testKey, testName, testTime) {
            currentTestId = testKey;
            const testSnap = await db.ref(`tests/${testKey}`).once('value');
            const test = testSnap.val();
            questions = []; Object.keys(test.questions || {}).forEach(k => questions.push(test.questions[k]));
            questions.sort((a,b) => a.id - b.id);
            userAnswers = new Array(questions.length).fill(null);
            timeLeft = (test.timeMinutes || 90) * 60; currentQ = 0;
            document.getElementById('testName').innerHTML = `<i class="bi bi-file-text"></i> ${testName}`;
            document.getElementById('examPage').style.display = 'block';
            startTimer(); renderQuestion();
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(timeLeft <= 0) { clearInterval(timerInterval); submitExam(); }
                else { timeLeft--; let m = Math.floor(timeLeft/60), s = timeLeft%60; document.getElementById('timer').innerHTML = `⏱️ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
            }, 1000);
        }

        function renderQuestion() {
            if(!questions.length) return;
            let q = questions[currentQ];
            let html = `<div class="question-box"><div class="question-text">${currentQ+1}. ${q.text}</div>`;
            q.options.forEach(opt => { let isSelected = (userAnswers[currentQ] === opt); html += `<div class="option ${isSelected ? 'selected' : ''}" onclick="selectAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</div>`; });
            html += `</div>`;
            document.getElementById('questionContainer').innerHTML = html;
            document.getElementById('qCounter').innerHTML = `प्रश्न ${currentQ+1} / ${questions.length}`;
            document.getElementById('progressFill').style.width = ((currentQ+1)/questions.length)*100 + '%';
        }
        function selectAnswer(ans) { userAnswers[currentQ] = ans; renderQuestion(); }
        function nextQuestion() { if(currentQ < questions.length-1) { currentQ++; renderQuestion(); } else alert('आखिरी प्रश्न'); }
        function prevQuestion() { if(currentQ > 0) { currentQ--; renderQuestion(); } }

        async function submitExam() {
            if(confirm('सबमिट करें? बाद में बदलाव नहीं होंगे')) {
                clearInterval(timerInterval);
                let score = 0, correctAnswers = [], questionTexts = [];
                for(let i=0; i<questions.length; i++) {
                    correctAnswers.push(questions[i].correct);
                    questionTexts.push(questions[i].text);
                    if(userAnswers[i] === questions[i].correct) score++;
                }
                const percent = (score/questions.length)*100;
                const user = auth.currentUser;
                await db.ref('results').push({ userId: user.uid, testId: currentTestId, testName: document.getElementById('testName').innerText.replace(/[^a-zA-Z0-9 ]/g, '').trim(), score: score, total: questions.length, percent: percent, answers: userAnswers, correctAnswers: correctAnswers, questions: questionTexts, submittedAt: Date.now() });
                const userRef = db.ref('users/' + user.uid);
                const userSnap = await userRef.once('value');
                const userData = userSnap.val() || {};
                const totalTests = (userData.totalTests || 0) + 1;
                const oldAvg = userData.avgScore || 0;
                const newAvg = ((oldAvg * (totalTests-1)) + percent) / totalTests;
                const bestScore = Math.max(userData.bestScore || 0, percent);
                let badges = userData.badges || [];
                if(percent >= 90 && !badges.includes('gold')) badges.push('gold');
                if(percent >= 75 && !badges.includes('silver')) badges.push('silver');
                if(percent >= 60 && !badges.includes('bronze')) badges.push('bronze');
                if(totalTests >= 5 && !badges.includes('iron')) badges.push('iron');
                await userRef.update({ totalTests, avgScore: newAvg, bestScore, badges });
                await db.ref(`users/${user.uid}/completedTests/${currentTestId}`).set(true);
                showReview(score, questions.length, percent, userAnswers, correctAnswers, questionTexts, document.getElementById('testName').innerText);
            }
        }

        function showReview(score, total, percent, userAnswers, correctAnswers, questions, testName) {
            document.getElementById('examPage').style.display = 'none';
            document.getElementById('reviewPage').style.display = 'block';
            document.getElementById('reviewTestName').innerText = testName;
            document.getElementById('reviewScore').innerText = score;
            document.getElementById('reviewTotal').innerText = total;
            document.getElementById('reviewPercentage').innerHTML = `${percent.toFixed(1)}%`;
            let badgeMsg = percent >= 90 ? '🏆 शानदार! गोल्ड मेडल!' : (percent >= 75 ? '🥈 बहुत अच्छा! सिल्वर मेडल!' : (percent >= 60 ? '🥉 अच्छा! ब्रॉन्ज मेडल!' : '💪 अगली बार और मेहनत करो!'));
            document.getElementById('reviewBadge').innerHTML = `<div style="background:var(--primary-bg); padding:10px; border-radius:12px;">${badgeMsg}</div>`;
            let html = '';
            for(let i=0; i<questions.length; i++) {
                let userAns = userAnswers[i] || '(छोड़ा)';
                let correct = correctAnswers[i];
                let isCorrect = userAnswers[i] === correct;
                html += `<div style="border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:10px;"><strong>प्रश्न ${i+1}:</strong> ${questions[i]}<br><span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">👉 आपका: ${userAns}</span><br><span style="color:var(--success);">✅ सही: ${correct}</span></div>`;
            }
            document.getElementById('reviewQuestionsList').innerHTML = html;
        }

        function closeExam() { clearInterval(timerInterval); document.getElementById('examPage').style.display = 'none'; }
        function closeReview() { document.getElementById('reviewPage').style.display = 'none'; loadProfile(); loadAvailableTests(); showSection('homeSection'); }
        function logout() { auth.signOut(); location.reload(); }

        loadAppSettings();
        auth.onAuthStateChanged(user => {
            if(user) { document.getElementById('loginSection').style.display = 'none'; showSection('homeSection'); loadDashboard(); }
            else { document.getElementById('loginSection').style.display = 'block'; document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('loginSection').classList.add('active'); }
        });
    </script>
</body>
</html>
