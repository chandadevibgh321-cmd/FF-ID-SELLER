<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMART STUDY - छात्र पोर्टल</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary-bg: #0F172A;
            --secondary-bg: #1E293B;
            --card-bg: #1E293B;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --accent-color: #FACC15;
            --accent-gradient: linear-gradient(135deg, #FACC15, #FBBF24);
            --primary-button: #3B82F6;
            --border-color: #334155;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        body.light {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        }
        body.light .custom-card, body.light .login-card { background: rgba(255,255,255,0.95); color: #1E293B; }
        .app-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 65px;
            background: var(--secondary-bg); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; }
        .header-title { font-weight: 600; font-size: 1rem; color: var(--text-primary); }
        .theme-toggle { background: rgba(255,255,255,0.1); border: none; color: var(--text-primary); font-size: 1.3rem; cursor: pointer; padding: 8px 12px; border-radius: 30px; transition: 0.3s; }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
            background: var(--secondary-bg); backdrop-filter: blur(10px);
            display: none; justify-content: space-around; align-items: center;
            z-index: 1000; border-top: 1px solid var(--border-color);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; color: var(--text-secondary); cursor: pointer;
            padding: 8px 20px; border-radius: 30px; transition: 0.3s;
        }
        .nav-item i { font-size: 1.5rem; }
        .nav-item span { font-size: 0.7rem; font-weight: 500; }
        .nav-item.active { color: var(--accent-color); background: rgba(250, 204, 21, 0.15); }
        .main-content { padding: 20px; margin-top: 65px; margin-bottom: 70px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .login-card {
            max-width: 420px; margin: 60px auto; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); border-radius: 32px; padding: 40px 32px;
            text-align: center; box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2); animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .smart-logo i { font-size: 60px; background: linear-gradient(135deg, #fff, #f0f0f0); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .smart-logo h2 { color: white; margin-top: 12px; font-weight: 800; font-size: 1.8rem; }
        .login-card h3 { color: white; margin: 25px 0 15px; font-weight: 600; }
        .login-card input {
            width: 100%; padding: 14px 20px; margin: 10px 0; border: none;
            border-radius: 50px; font-size: 15px; background: rgba(255,255,255,0.95);
            transition: 0.3s;
        }
        .login-card input:focus { outline: none; box-shadow: 0 0 0 3px rgba(250,204,21,0.3); transform: translateY(-2px); }
        .login-card button {
            width: 100%; padding: 14px; background: var(--accent-gradient);
            color: #1a1a2e; border: none; border-radius: 50px; font-size: 18px;
            font-weight: 700; cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .login-card button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(250,204,21,0.3); }
        .toggle-link { color: #FACC15; cursor: pointer; margin-top: 20px; display: inline-block; font-size: 0.9rem; font-weight: 500; }
        .toggle-link:hover { text-decoration: underline; }
        .error-msg { color: #ff6b6b; margin-top: 15px; font-size: 0.85rem; }
        .custom-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color); transition: 0.3s; }
        .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--text-primary); }
        .test-card {
            background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 14px;
            border: 1px solid var(--border-color); cursor: pointer; transition: 0.3s;
        }
        .test-card:hover { transform: translateX(6px); border-color: var(--accent-color); }
        .test-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
        .test-meta { font-size: 0.75rem; color: var(--text-secondary); display: flex; gap: 16px; margin: 10px 0; }
        .badge-available { background: linear-gradient(135deg, #10B981, #059669); color: white; padding: 4px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 16px; }
        .profile-stats { display: flex; justify-content: space-around; margin: 20px 0; gap: 12px; }
        .stat-item { text-align: center; flex: 1; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 16px; }
        .stat-item strong { font-size: 1.4rem; display: block; color: var(--accent-color); }
        .stat-item span { color: var(--text-secondary); font-size: 0.75rem; }
        .leaderboard-filters { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-btn {
            flex: 1; padding: 10px 16px; background: var(--secondary-bg);
            border: 1px solid var(--border-color); border-radius: 40px;
            color: var(--text-secondary); cursor: pointer; font-size: 0.85rem;
            font-weight: 600; transition: 0.3s;
        }
        .filter-btn.active { background: var(--accent-gradient); color: #1a1a2e; border-color: transparent; }
        .leaderboard-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid var(--border-color);
        }
        .leaderboard-user { display: flex; align-items: center; gap: 12px; }
        .leaderboard-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .avatar-placeholder {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--accent-gradient); display: flex; align-items: center;
            justify-content: center; color: #1a1a2e; font-weight: bold; font-size: 1.1rem;
        }
        .rank-1 { background: linear-gradient(135deg, #FFD70020, transparent); border-left: 4px solid #FFD700; padding-left: 16px; border-radius: 12px; margin-left: -4px; }
        .rank-2 { background: linear-gradient(135deg, #C0C0C020, transparent); border-left: 4px solid #C0C0C0; padding-left: 16px; border-radius: 12px; margin-left: -4px; }
        .rank-3 { background: linear-gradient(135deg, #CD7F3220, transparent); border-left: 4px solid #CD7F32; padding-left: 16px; border-radius: 12px; margin-left: -4px; }
        .history-item { cursor: pointer; transition: 0.3s; }
        .history-item:hover { transform: translateX(6px); border-left-color: var(--accent-color); }
        .timer { text-align: center; font-size: 2.2rem; font-weight: 800; color: var(--danger); margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 60px; }
        .progress-bar { background: var(--border-color); border-radius: 50px; height: 8px; margin-bottom: 24px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, var(--success), #34D399); width: 0%; height: 100%; transition: width 0.3s; }
        .question-box { background: var(--primary-bg); border-radius: 20px; padding: 24px; margin: 20px 0; }
        .question-text { font-size: 1rem; font-weight: 600; margin-bottom: 20px; color: var(--text-primary); }
        .option {
            padding: 14px 20px; margin: 10px 0; background: var(--card-bg);
            border-radius: 60px; cursor: pointer; border: 1px solid var(--border-color);
            transition: 0.3s; color: var(--text-primary); font-weight: 500;
        }
        .option:hover { background: rgba(255,255,255,0.1); transform: translateX(6px); }
        .option.selected { background: var(--accent-gradient); color: #1a1a2e; border-color: transparent; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; }
        .nav-buttons button { padding: 12px 28px; background: var(--primary-button); color: white; border: none; border-radius: 60px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .nav-buttons button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59,130,246,0.3); }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, var(--success), #34D399); color: white; border: none; border-radius: 60px; font-weight: 700; margin-top: 20px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(16,185,129,0.3); }
        .share-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .share-buttons button { flex: 1; padding: 10px; border-radius: 60px; font-size: 0.85rem; font-weight: 600; }
        .no-data { text-align: center; padding: 50px; color: var(--text-secondary); font-size: 0.9rem; }
        .result-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 3000; overflow-y: auto; padding: 20px;
        }
        .result-modal-content { background: var(--card-bg); border-radius: 28px; padding: 24px; max-width: 650px; margin: 40px auto; border: 1px solid var(--border-color); }
        .result-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .close-modal { background: var(--danger); color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .close-modal:hover { transform: scale(1.1); }
        .result-question { padding: 14px; margin: 12px 0; border-radius: 16px; background: rgba(0,0,0,0.2); }
        .result-correct { border-left: 4px solid var(--success); }
        .result-wrong { border-left: 4px solid var(--danger); }
        .swiper-container { width: 100%; height: 200px; border-radius: 20px; margin-bottom: 20px; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
        .swiper-pagination-bullet { background: white; }
        .swiper-pagination-bullet-active { background: var(--accent-color); }
        @media (max-width: 480px) {
            .main-content { padding: 16px; }
            .login-card { margin: 30px 20px; padding: 32px 24px; }
            .profile-avatar { width: 70px; height: 70px; }
            .filter-btn { padding: 8px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <header class="app-header" id="appHeader" style="display: none;">
        <div class="header-left">
            <img src="" alt="Logo" class="header-logo" id="appLogo">
            <span class="header-title" id="headerUserGreeting">SMART STUDY</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="bi bi-moon-stars-fill"></i></button>
    </header>

    <div id="loginSection">
        <div class="login-card">
            <div class="smart-logo"><i class="fas fa-graduation-cap"></i><h2>SMART STUDY</h2></div>
            <h3 id="authTitle">🔐 लॉगिन</h3>
            <input type="text" id="username" placeholder="यूजरनेम">
            <input type="email" id="email" placeholder="ईमेल">
            <input type="password" id="password" placeholder="पासवर्ड">
            <input type="text" id="fullName" placeholder="पूरा नाम" style="display:none;">
            <button id="authBtn" onclick="login()">लॉगिन करें</button>
            <div class="toggle-link" onclick="toggleAuthMode()">नया अकाउंट बनाएँ? साइनअप करें</div>
            <div id="authError" class="error-msg"></div>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <main class="main-content">
            <div id="homeSection" class="section active">
                <div class="swiper-container" id="promotionSlider"><div class="swiper-wrapper"></div><div class="swiper-pagination"></div></div>
                <div id="announcementsBox"></div>
                <div id="liveClassBox" class="custom-card" style="border-left:4px solid var(--primary-button);"></div>
                <div class="section-title"><i class="bi bi-journal-bookmark-fill"></i> उपलब्ध टेस्ट</div>
                <div id="testsList"></div>
                <div class="section-title mt-3"><i class="bi bi-file-pdf-fill"></i> स्टडी नोट्स</div>
                <div id="notesList"></div>
            </div>

            <div id="leaderboardSection" class="section">
                <div class="section-title"><i class="bi bi-trophy-fill"></i> लीडरबोर्ड</div>
                <div class="leaderboard-filters">
                    <button class="filter-btn" data-period="all">🏆 ऑल टाइम</button>
                    <button class="filter-btn" data-period="weekly">📅 वीकली</button>
                    <button class="filter-btn" data-period="monthly">📆 मंथली</button>
                </div>
                <div class="custom-card" id="leaderboardList"></div>
            </div>

            <div id="profileSection" class="section">
                <div class="custom-card text-center">
                    <img id="profileAvatar" src="" class="profile-avatar">
                    <h3 id="profileName"></h3>
                    <p id="profileEmail" style="font-size:0.8rem; color:var(--text-secondary);"></p>
                    <div class="profile-stats">
                        <div class="stat-item"><strong id="totalTests">0</strong><span>टेस्ट</span></div>
                        <div class="stat-item"><strong id="avgScore">0</strong><span>औसत%</span></div>
                        <div class="stat-item"><strong id="bestScore">0</strong><span>बेस्ट%</span></div>
                    </div>
                    <div id="improvementTracker" class="mt-2"></div>
                    <div id="badgesEarned" class="mt-2"></div>
                    <div id="aiTip" class="mt-2" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:16px; font-size:0.85rem;"></div>
                    <div class="share-buttons">
                        <button class="btn" style="background:#25D366; color:white;" onclick="shareResultAsImage()"><i class="bi bi-whatsapp"></i> WhatsApp</button>
                        <button class="btn" style="background:var(--primary-button); color:white;" onclick="downloadResultPDF()"><i class="bi bi-file-pdf"></i> PDF</button>
                    </div>
                    <hr style="margin:20px 0; border-color:var(--border-color);">
                    <button class="btn" style="background:var(--danger); color:white;" onclick="logout()"><i class="bi bi-box-arrow-right"></i> लॉगआउट</button>
                </div>
                <div class="section-title"><i class="bi bi-clock-history"></i> टेस्ट हिस्ट्री</div>
                <div id="testHistoryList"></div>
            </div>
        </main>
        <nav class="bottom-nav" id="bottomNav">
            <div class="nav-item active" data-section="homeSection"><i class="bi bi-house-door-fill"></i><span>Home</span></div>
            <div class="nav-item" data-section="leaderboardSection"><i class="bi bi-trophy-fill"></i><span>Leaderboard</span></div>
            <div class="nav-item" data-section="profileSection"><i class="bi bi-person-fill"></i><span>Profile</span></div>
        </nav>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="result-modal">
        <div class="result-modal-content">
            <div class="result-modal-header">
                <h3>📝 टेस्ट रिजल्ट: <span id="modalTestName"></span></h3>
                <button class="close-modal" onclick="closeResultModal()">✕</button>
            </div>
            <div id="modalResultDetails"></div>
        </div>
    </div>

    <div id="examPage" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.98); z-index:2000; overflow-y:auto; padding:16px;">
        <div class="custom-card">
            <button class="btn" style="background:var(--text-secondary); color:white; padding:10px 20px; margin-bottom:16px; border:none; border-radius:50px; cursor:pointer;" onclick="closeExam()"><i class="bi bi-arrow-left"></i> वापस</button>
            <h2 id="testName" style="font-size:1.3rem; color:var(--text-primary);"></h2>
            <div class="timer" id="timer">⏱️ 90:00</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div id="questionContainer"></div>
            <div class="nav-buttons">
                <button onclick="prevQuestion()"><i class="bi bi-chevron-left"></i> पिछला</button>
                <span id="qCounter" style="padding:8px; color:var(--text-primary); font-weight:600;">प्रश्न 1 / 0</span>
                <button onclick="nextQuestion()">अगला <i class="bi bi-chevron-right"></i></button>
            </div>
            <button class="submit-btn" onclick="submitExam()"><i class="bi bi-check-circle"></i> टेस्ट सबमिट करें</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDBxkEXfCDbvOCPKPIjCbSS3V2M6QOIKUY",
            authDomain: "zone-battel.firebaseapp.com",
            databaseURL: "https://zone-battel-default-rtdb.firebaseio.com",
            projectId: "zone-battel",
            storageBucket: "zone-battel.firebasestorage.app",
            messagingSenderId: "534047646078",
            appId: "1:534047646078:web:31d5ade3a74109fc76d32f"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null, currentTestId = null, questions = [], userAnswers = [], timerInterval = null, timeLeft = 0, currentQ = 0, isSignup = false;
        let swiperInstance = null, allResults = [];
        let currentLeaderboardPeriod = 'all';

        function toggleTheme() { 
            document.body.classList.toggle('light'); 
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        }
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light');

        async function loadAppSettings() {
            const snap = await db.ref('settings').once('value');
            const settings = snap.val() || {};
            if(settings.logoUrl) document.getElementById('appLogo').src = settings.logoUrl;
            else document.getElementById('appLogo').src = 'https://via.placeholder.com/40/FFFFFF/0F172A?text=S';
            document.title = settings.appName || 'SMART STUDY';
        }

        async function login() {
            const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value;
            if(!email || !password) { showError('सब भरें'); return; }
            try { await auth.signInWithEmailAndPassword(email, password); } catch(e) { showError(e.message); }
        }

        async function signup() {
            const username = document.getElementById('username').value.trim(), email = document.getElementById('email').value.trim(), password = document.getElementById('password').value, fullName = document.getElementById('fullName').value.trim();
            if(!username || !email || !password || !fullName) { showError('सब भरें'); return; }
            if(password.length < 6) { showError('पासवर्ड 6+ अक्षर'); return; }
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.ref('users/' + cred.user.uid).set({ username, email, fullName, totalTests: 0, avgScore: 0, bestScore: 0, badges: [], createdAt: Date.now() });
                alert('अकाउंट बन गया! अब लॉगिन करें'); toggleAuthMode();
            } catch(e) { showError(e.message); }
        }

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('authTitle').innerText = isSignup ? '📝 साइनअप' : '🔐 लॉगिन';
            document.getElementById('fullName').style.display = isSignup ? 'block' : 'none';
            document.getElementById('authBtn').innerText = isSignup ? 'साइनअप करें' : 'लॉगिन करें';
            document.getElementById('authBtn').setAttribute('onclick', isSignup ? 'signup()' : 'login()');
            document.querySelector('.toggle-link').innerHTML = isSignup ? 'पहले से अकाउंट है? लॉगिन करें' : 'नया अकाउंट बनाएँ? साइनअप करें';
        }

        function showError(msg) { let e = document.getElementById('authError'); e.innerText = msg; setTimeout(() => e.innerText = '', 3000); }

        function showSection(sectionId) {
            document.querySelectorAll('#mainApp .section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('#bottomNav .nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`#bottomNav .nav-item[data-section="${sectionId}"]`).classList.add('active');
            if(sectionId === 'homeSection') { loadPromotions(); loadAnnouncements(); loadLiveClass(); loadAvailableTests(); loadNotes(); }
            if(sectionId === 'leaderboardSection') loadLeaderboardByPeriod(currentLeaderboardPeriod);
            if(sectionId === 'profileSection') loadProfile();
        }

        async function loadLeaderboardByPeriod(period) {
            const usersSnap = await db.ref('users').once('value');
            let users = [];
            
            if(period === 'all') {
                usersSnap.forEach(u => { 
                    const data = u.val(); 
                    if(data.avgScore !== undefined && data.avgScore > 0) {
                        users.push({ 
                            name: data.fullName || data.username, 
                            avgScore: data.avgScore,
                            photoURL: data.photoURL || null
                        });
                    }
                });
            } else {
                const resultsSnap = await db.ref('results').once('value');
                const now = Date.now();
                const weekAgo = now - 7 * 24 * 60 * 60 * 1000;
                const monthAgo = now - 30 * 24 * 60 * 60 * 1000;
                const userScores = {};
                
                resultsSnap.forEach(r => {
                    const result = r.val();
                    const resultDate = result.submittedAt;
                    let include = false;
                    if(period === 'weekly' && resultDate >= weekAgo) include = true;
                    if(period === 'monthly' && resultDate >= monthAgo) include = true;
                    
                    if(include && result.userId) {
                        if(!userScores[result.userId]) {
                            userScores[result.userId] = { totalScore: 0, totalTests: 0 };
                        }
                        userScores[result.userId].totalScore += result.percent;
                        userScores[result.userId].totalTests++;
                    }
                });
                
                for(const [userId, scores] of Object.entries(userScores)) {
                    const userSnap = await db.ref('users/' + userId).once('value');
                    const userData = userSnap.val();
                    if(userData) {
                        const avgScore = scores.totalTests > 0 ? scores.totalScore / scores.totalTests : 0;
                        users.push({
                            name: userData.fullName || userData.username,
                            avgScore: avgScore,
                            photoURL: userData.photoURL || null
                        });
                    }
                }
            }
            
            users.sort((a,b) => b.avgScore - a.avgScore);
            let html = '';
            if(users.length === 0) {
                html = '<div class="no-data">🏆 कोई रैंकिंग उपलब्ध नहीं</div>';
            } else {
                users.slice(0,10).forEach((u, idx) => {
                    let rankClass = '';
                    if(idx === 0) rankClass = 'rank-1';
                    else if(idx === 1) rankClass = 'rank-2';
                    else if(idx === 2) rankClass = 'rank-3';
                    const avatarHtml = u.photoURL ? `<img src="${u.photoURL}" class="leaderboard-avatar">` : `<div class="avatar-placeholder">${u.name.charAt(0).toUpperCase()}</div>`;
                    html += `<div class="leaderboard-item ${rankClass}">
                        <div class="leaderboard-user">
                            ${avatarHtml}
                            <span style="color:var(--text-primary);"><strong>${idx+1}.</strong> ${u.name}</span>
                        </div>
                        <span style="color:var(--text-primary);">⭐ ${u.avgScore.toFixed(1)}%</span>
                    </div>`;
                });
            }
            document.getElementById('leaderboardList').innerHTML = html;
        }

        async function startTest(testKey, testName, testTime) {
            currentTestId = testKey;
            const testSnap = await db.ref(`tests/${testKey}`).once('value');
            const test = testSnap.val();
            questions = []; 
            if(test.questions) {
                Object.keys(test.questions).forEach(k => questions.push(test.questions[k]));
                questions.sort((a,b) => a.id - b.id);
            }
            userAnswers = new Array(questions.length).fill(null);
            timeLeft = (test.timeMinutes || 90) * 60;
            currentQ = 0;
            document.getElementById('testName').innerHTML = `<i class="bi bi-file-text"></i> ${testName}`;
            document.getElementById('examPage').style.display = 'block';
            startTimer();
            renderQuestion();
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(timeLeft <= 0) { 
                    clearInterval(timerInterval); 
                    alert("⏰ समय समाप्त! आपका टेस्ट अपने आप सबमिट किया जा रहा है।");
                    submitExam(); 
                } else {
                    timeLeft--;
                    let m = Math.floor(timeLeft/60), s = timeLeft%60;
                    document.getElementById('timer').innerHTML = `⏱️ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                }
            }, 1000);
        }

        function renderQuestion() {
            if(!questions.length) return;
            let q = questions[currentQ];
            let html = `<div class="question-box"><div class="question-text">${currentQ+1}. ${q.text}</div>`;
            q.options.forEach(opt => { 
                let isSelected = (userAnswers[currentQ] === opt);
                html += `<div class="option ${isSelected ? 'selected' : ''}" onclick="selectAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</div>`;
            });
            html += `</div>`;
            document.getElementById('questionContainer').innerHTML = html;
            document.getElementById('qCounter').innerHTML = `प्रश्न ${currentQ+1} / ${questions.length}`;
            document.getElementById('progressFill').style.width = ((currentQ+1)/questions.length)*100 + '%';
        }

        function selectAnswer(ans) { userAnswers[currentQ] = ans; renderQuestion(); }
        function nextQuestion() { if(currentQ < questions.length-1) { currentQ++; renderQuestion(); } else alert('आखिरी प्रश्न'); }
        function prevQuestion() { if(currentQ > 0) { currentQ--; renderQuestion(); } }

        async function submitExam() {
            if(confirm('सबमिट करें? बाद में बदलाव नहीं होंगे')) {
                clearInterval(timerInterval);
                let score = 0;
                let correctAnswers = [];
                let questionTexts = [];
                for(let i=0; i<questions.length; i++) {
                    correctAnswers.push(questions[i].correct);
                    questionTexts.push(questions[i].text);
                    if(userAnswers[i] === questions[i].correct) score++;
                }
                const percent = (score/questions.length)*100;
                const user = auth.currentUser;
                
                // Save result
                await db.ref('results').push({ 
                    userId: user.uid, 
                    testId: currentTestId, 
                    testName: document.getElementById('testName').innerText.replace(/[^a-zA-Z0-9 ]/g, '').trim(), 
                    score: score, 
                    total: questions.length, 
                    percent: percent, 
                    answers: userAnswers, 
                    correctAnswers: correctAnswers, 
                    questions: questionTexts, 
                    submittedAt: Date.now() 
                });
                
                // Update user stats
                const userRef = db.ref('users/' + user.uid);
                const userSnap = await userRef.once('value');
                const userData = userSnap.val() || {};
                const totalTests = (userData.totalTests || 0) + 1;
                const oldAvg = userData.avgScore || 0;
                const newAvg = ((oldAvg * (totalTests-1)) + percent) / totalTests;
                const bestScore = Math.max(userData.bestScore || 0, percent);
                let badges = userData.badges || [];
                if(percent >= 90 && !badges.includes('gold')) badges.push('gold');
                if(percent >= 75 && !badges.includes('silver')) badges.push('silver');
                if(percent >= 60 && !badges.includes('bronze')) badges.push('bronze');
                if(totalTests >= 5 && !badges.includes('iron')) badges.push('iron');
                
                await userRef.update({ totalTests, avgScore: newAvg, bestScore, badges });
                await db.ref(`users/${user.uid}/completedTests/${currentTestId}`).set(true);
                
                // Update leaderboard immediately
                if(currentLeaderboardPeriod) {
                    await loadLeaderboardByPeriod(currentLeaderboardPeriod);
                }
                
                showReview(score, questions.length, percent, userAnswers, correctAnswers, questionTexts, document.getElementById('testName').innerText);
            }
        }

            const reviewDiv = document.getElementById('reviewPage');
            if(!reviewDiv) {

                div.style.zIndex = '2000';
                div.style.overflowY = 'auto';
                div.style.padding = '20px';
                document.body.appendChild(div);
            }
            const reviewDivEl = document.getElementById('reviewPage');
            reviewDivEl.style.display = 'block';
            reviewDivEl.innerHTML = `
                <div class="custom-card">
                    <h2 style="color:var(--text-primary);">📝 टेस्ट रिजल्ट - ${testName}</h2>
                    <div class="text-center my-3">
                        <h3 style="color:var(--text-primary);">आपका स्कोर: <span style="color:var(--success);">${score}</span> / ${total}</h3>
                        <h4 style="color:var(--text-primary);">${percent.toFixed(1)}%</h4>
                        <div style="background:rgba(0,0,0,0.2); padding:12px; border-radius:16px;">${percent >= 90 ? '🏆 शानदार! गोल्ड मेडल!' : (percent >= 75 ? '🥈 बहुत अच्छा! सिल्वर मेडल!' : (percent >= 60 ? '🥉 अच्छा! ब्रॉन्ज मेडल!' : '💪 अगली बार और मेहनत करो!'))}</div>
                    </div>
                    <div id="reviewQuestionsList"></div>
                    <button class="btn" style="background:var(--primary-button); color:white; width:100%; margin-top:16px; padding:12px; border-radius:50px;" onclick="closeReview()"><i class="bi bi-house-door"></i> होम पर जाएँ</button>
                </div>
            `;
            let html = '';
            for(let i=0; i<questions.length; i++) {
                let userAns = userAnswers[i] || '(छोड़ा)';
                let correct = correctAnswers[i];
                let isCorrect = userAnswers[i] === correct;
                html += `<div style="border-bottom:1px solid var(--border-color); padding-bottom:12px; margin-bottom:12px;">
                    <strong style="color:var(--text-primary);">प्रश्न ${i+1}:</strong> ${questions[i]}<br>
                    <span style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">👉 आपका: ${userAns}</span><br>
                    <span style="color:var(--success);">✅ सही: ${correct}</span>
                </div>`;
            }
            document.getElementById('reviewQuestionsList').innerHTML = html;
        }

        function closeExam() { clearInterval(timerInterval); document.getElementById('examPage').style.display = 'none'; }
        function closeReview() { 
            document.getElementById('reviewPage').style.display = 'none'; 
            loadProfile(); 
            loadAvailableTests(); 
            showSection('homeSection'); 
        }
        function logout() { auth.signOut(); location.reload(); }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('appHeader').style.display = 'flex';
                document.getElementById('bottomNav').style.display = 'flex';
                loadDashboard();
                loadAppSettings();
                showSection('homeSection');
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('bottomNav').style.display = 'none';
            }
        });
    </script>
</body>
</html>
